agent:
  system_template: |
    You are a skilled software engineer. You interact with a computer shell to complete coding tasks.
    You execute commands by writing them inside ```bash code blocks.
  instance_template: |
    <task>
    {{task}}
    </task>

    <instructions>
    # Instructions

    Read the task above carefully. You have a full Linux shell environment at `/testbed`.

    ## Response format

    For each response:

    1. Start with a **THOUGHT** section explaining your reasoning, analysis, and what you plan to do
    2. Then provide exactly **one** ```bash code block with your command

    Without a ```bash code block, your command will NOT execute.

    <example_response>
    THOUGHT: I need to understand the target function and how it's used. Let me read the file with line numbers so I can plan my edits.

    ```bash
    nl -ba source/utilities.js
    ```
    </example_response>

    <example_response>
    THOUGHT: Looking at line 25, the condition `string[index - 1] === '\r'` checks for carriage returns. If I change the comparison from `index - 1` to `index`, it will check the wrong character position, causing CRLF handling to break in subtle ways.

    ```bash
    sed -i '25s/index - 1/index/' source/utilities.js
    ```
    </example_response>

    ## Workflow
    1. Explore the codebase to understand the target code and its context
    2. Read the relevant files carefully
    3. Plan your bug — think about what changes would cause failures
    4. Make your edits (one command per turn, multiple turns is fine)
    5. Verify your changes look correct
    6. Submit when done

    ## Command guide

    **Reading files:**
    - `cat <file>` — view entire file
    - `nl -ba <file>` — view with line numbers
    - `sed -n '10,30p' <file>` — view specific line range
    - `head -n 50 <file>` — view first 50 lines

    **Exploring:**
    - `ls`, `find . -name '*.js'`, `grep -rn 'pattern' <dir>`

    **Editing files — prefer `sed` for targeted edits:**
    - `sed -i 's/old_text/new_text/' file` — replace first match per line
    - `sed -i 's/old_text/new_text/g' file` — replace all matches
    - `sed -i 'Ns/old_text/new_text/' file` — replace on line N
    - `sed -i 'N,Ms/old_text/new_text/g' file` — replace in line range

    Avoid overwriting entire files with `cat > file << EOF`. Prefer surgical edits.

    ## Rules
    - Every response MUST start with THOUGHT and include exactly one ```bash code block
    - Prefer `sed -i` for edits — avoid `cat >` or heredocs that rewrite entire files
    - Do NOT revert your changes or run `git checkout`
    - Do NOT create patch files — leave your changes in the working tree
    - Do NOT modify test files
    - Directory and environment changes are not persistent between commands

    ## Submission
    When you are satisfied with your changes, submit with this exact command:

    ```bash
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && echo "Done"
    ```
    </instructions>
  step_limit: 30
  cost_limit: 3.

environment:
  cwd: "/testbed"
  timeout: 60
  interpreter: ["bash", "-c"]
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"

model:
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    Output too long. Use commands that produce less output, or redirect to a file.
    </warning>
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}
  format_error_template: |
    Tool call error:

    <error>
    {{error}}
    </error>

    You MUST wrap your command in a ```bash code block. Example:

    THOUGHT: I need to check the file contents.

    ```bash
    cat source/utilities.js
    ```

    Plain text commands will not execute. Always use THOUGHT + one ```bash block.
